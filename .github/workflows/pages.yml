name: Deploy AtlasSQL Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: altassql-book
    env:
      BOOK_BASE: /atlas-sql/
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: altassql-book/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate plan and source content
        run: npm run check
      - name: Build VitePress site
        run: npm run build
      - name: Validate built links and anchors
        run: npm run check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: altassql-book/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
