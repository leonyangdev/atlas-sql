  # 聚合（3 题）
  - id: tune-009
    question: 每月营销活动的平均触达人数
    category: aggregation
    domain: marketing
    required_tables: [dim_campaign, fact_campaign_touch]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT DATE_TRUNC('month', t.touched_at) AS month,
             AVG(monthly_reach.reach) AS avg_reach_per_campaign
      FROM (
          SELECT campaign_id,
                 DATE_TRUNC('month', touched_at) AS month,
                 COUNT(DISTINCT customer_id) AS reach
          FROM fact_campaign_touch
          GROUP BY campaign_id, DATE_TRUNC('month', touched_at)
      ) monthly_reach
      JOIN fact_campaign_touch t ON true
      GROUP BY DATE_TRUNC('month', t.touched_at)
      ORDER BY month;
    expected_row_count: ~
    expected_result_checksum: ~

  - id: tune-010
    question: 查询订单含多个 SKU 的占比
    category: aggregation
    domain: sales
    required_tables: [fact_order, fact_order_item]
    difficulty: medium
    identity: public
    gold_sql: |
      WITH order_sku_count AS (
          SELECT order_id, COUNT(DISTINCT sku_id) AS sku_count
          FROM fact_order_item
          GROUP BY order_id
      )
      SELECT
        COUNT(CASE WHEN oc.sku_count > 1 THEN 1 END) AS multi_sku_orders,
        COUNT(*) AS total_orders,
        ROUND(COUNT(CASE WHEN oc.sku_count > 1 THEN 1 END)::numeric / COUNT(*), 4) AS ratio
      FROM fact_order o
      JOIN order_sku_count oc ON oc.order_id = o.id
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false;
    expected_row_count: 1
    expected_result_checksum: ~

  - id: tune-011
    question: 各门店门店达成销售目标的月份数
    category: aggregation
    domain: sales
    required_tables: [fact_order, fact_order_item, store_target, dim_store]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH actual AS (
          SELECT o.store_id,
                 DATE_TRUNC('month', o.paid_at) AS month,
                 SUM(oi.net_amount) AS actual_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          GROUP BY o.store_id, DATE_TRUNC('month', o.paid_at)
      )
      SELECT st.store_name,
             COUNT(CASE WHEN a.actual_sales >= t.target_value THEN 1 END) AS months_hit_target
      FROM actual a
      JOIN store_target t
        ON t.store_id = a.store_id
        AND t.target_month = a.month
        AND t.metric_code = 'NET_SALES'
      JOIN dim_store st ON a.store_id = st.id AND st.is_current = true
      GROUP BY st.id, st.store_name
      ORDER BY months_hit_target DESC;
    expected_row_count: ~
    expected_result_checksum: ~

  # Top N（3 题）
  - id: tune-012
    question: 本年度销售额增长最快的 3 个品类（同比 2025 年）
    category: top_n
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_sku, dim_product, product_category_history, dim_category]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH cat_sales AS (
          SELECT cat.id AS cat_id, cat.category_name,
                 SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2026-01-01'
                          THEN oi.net_amount ELSE 0 END) AS sales_2025,
                 SUM(CASE WHEN o.paid_at >= '2026-01-01' AND o.paid_at < '2026-07-01'
                          THEN oi.net_amount ELSE 0 END) AS sales_2026
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          JOIN dim_sku s ON oi.sku_id = s.id AND s.is_current = true
          JOIN dim_product p ON s.product_id = p.id AND p.is_current = true
          JOIN product_category_history pch ON pch.product_id = p.id AND pch.is_primary = true
          JOIN dim_category cat ON pch.category_id = cat.id AND cat.is_current = true
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          GROUP BY cat.id, cat.category_name
      )
      SELECT category_name,
             sales_2025, sales_2026,
             ROUND((sales_2026 - sales_2025) / NULLIF(sales_2025, 0), 4) AS growth_rate
      FROM cat_sales
      WHERE sales_2025 > 0
      ORDER BY growth_rate DESC
      LIMIT 3;
    expected_row_count: ~
    expected_result_checksum: ~
    is_ordered: true

  - id: tune-013
    question: 退款率最高的 5 个渠道
    category: top_n
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item, dim_sales_channel]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH channel_metrics AS (
          SELECT o.channel_id,
                 SUM(oi.net_amount) AS gross_paid,
                 COALESCE(SUM(ri.refund_amount), 0) AS refunded
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          LEFT JOIN fact_refund r ON r.order_id = o.id AND r.refund_status = 'REFUNDED'
          LEFT JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          GROUP BY o.channel_id
      )
      SELECT ch.channel_name,
             ROUND(cm.refunded / NULLIF(cm.gross_paid, 0), 4) AS refund_rate
      FROM channel_metrics cm
      JOIN dim_sales_channel ch ON ch.id = cm.channel_id AND ch.is_current = true
      ORDER BY refund_rate DESC
      LIMIT 5;
    expected_row_count: ~
    expected_result_checksum: ~
    is_ordered: true

