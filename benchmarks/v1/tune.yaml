  # 指标语义（3 题）
  - id: tune-022
    question: 计算整个数据集的销售数量（SKU 销售量）
    category: metric
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item]
    difficulty: medium
    identity: public
    gold_sql: |
      WITH sold AS (
          SELECT SUM(oi.quantity) AS qty_sold
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
      ),
      returned AS (
          SELECT SUM(ri.refund_quantity) AS qty_returned
          FROM fact_refund r
          JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE r.refund_status = 'REFUNDED'
      )
      SELECT
        (SELECT qty_sold FROM sold) AS qty_sold,
        COALESCE((SELECT qty_returned FROM returned), 0) AS qty_returned,
        (SELECT qty_sold FROM sold) - COALESCE((SELECT qty_returned FROM returned), 0) AS net_qty
      ;
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [sales_quantity]

