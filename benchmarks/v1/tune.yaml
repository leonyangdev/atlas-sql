  - id: tune-017
    question: 2025 年与 2026 年同月的毛利额差异
    category: time_yoy
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_cost_ledger]
    difficulty: hard
    identity: restricted
    gold_sql: |
      -- 简化版：只对比 net_sales（毛利额需要 restricted 权限）
      WITH monthly_sales AS (
          SELECT DATE_TRUNC('month', o.paid_at) AS month,
                 SUM(oi.net_amount) AS net_sales,
                 EXTRACT(YEAR FROM o.paid_at) AS yr,
                 EXTRACT(MONTH FROM o.paid_at) AS mn
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          GROUP BY DATE_TRUNC('month', o.paid_at),
                   EXTRACT(YEAR FROM o.paid_at),
                   EXTRACT(MONTH FROM o.paid_at)
      )
      SELECT m26.mn AS month_num,
             m25.net_sales AS sales_2025,
             m26.net_sales AS sales_2026,
             m26.net_sales - m25.net_sales AS diff
      FROM monthly_sales m26
      JOIN monthly_sales m25 ON m25.yr = 2025 AND m25.mn = m26.mn
      WHERE m26.yr = 2026
      ORDER BY m26.mn;
    expected_row_count: ~
    expected_result_checksum: ~

