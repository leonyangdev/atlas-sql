  # 单表（3 题）
  - id: tune-001
    question: 查询线下渠道的所有门店
    category: single_table
    domain: store
    required_tables: [dim_store, dim_sales_channel]
    difficulty: easy
    identity: public
    gold_sql: |
      SELECT st.store_name, st.store_type
      FROM dim_store st
      JOIN dim_sales_channel ch ON ch.is_online = false AND ch.is_current = true
      WHERE st.is_current = true
        AND st.store_type != 'OUTLET'
      ORDER BY st.store_name;
    expected_row_count: ~
    expected_result_checksum: ~

