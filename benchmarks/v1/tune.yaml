  # 值映射（2 题）
  - id: tune-020
    question: 查询"营收"（别名）同比是否增长
    category: value_mapping
    domain: sales
    required_tables: [fact_order, fact_order_item]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT
        SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2026-01-01'
                 THEN oi.net_amount ELSE 0 END) AS revenue_2025,
        SUM(CASE WHEN o.paid_at >= '2026-01-01' AND o.paid_at < '2026-07-01'
                 THEN oi.net_amount ELSE 0 END) AS revenue_h1_2026,
        CASE
          WHEN SUM(CASE WHEN o.paid_at >= '2026-01-01' AND o.paid_at < '2026-07-01'
                        THEN oi.net_amount ELSE 0 END) >
               SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2026-01-01'
                        THEN oi.net_amount ELSE 0 END) / 2.0
          THEN true ELSE false
        END AS h1_yoy_increased
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false;
    expected_row_count: 1
    expected_result_checksum: ~
    note: '"营收"是 net_sales 的别名（同义词）'

