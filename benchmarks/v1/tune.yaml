  - id: tune-006
    question: 2026 年各渠道的退款率
    category: join
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item, dim_sales_channel]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH channel_sales AS (
          SELECT o.channel_id, SUM(oi.net_amount) AS gross_paid
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-07-01'
          GROUP BY o.channel_id
      ),
      channel_refunds AS (
          SELECT o.channel_id, SUM(ri.refund_amount) AS total_refund
          FROM fact_order o
          JOIN fact_refund r ON r.order_id = o.id AND r.refund_status = 'REFUNDED'
          JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE o.is_test = false
            AND r.refunded_at >= '2026-01-01'
            AND r.refunded_at < '2026-07-01'
          GROUP BY o.channel_id
      )
      SELECT ch.channel_name,
             cs.gross_paid,
             COALESCE(cr.total_refund, 0) AS refunded,
             ROUND(COALESCE(cr.total_refund, 0) / NULLIF(cs.gross_paid, 0), 4) AS refund_rate
      FROM channel_sales cs
      JOIN dim_sales_channel ch ON ch.id = cs.channel_id AND ch.is_current = true
      LEFT JOIN channel_refunds cr ON cr.channel_id = cs.channel_id
      ORDER BY refund_rate DESC;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [refund_rate]

  - id: tune-007
    question: 查询每位会员当前等级和历史最高等级
    category: join
    domain: customer
    required_tables: [dim_customer, customer_membership_history, dim_membership_tier]
    difficulty: hard
    identity: public
    gold_sql: |
      SELECT c.customer_code,
             cur_t.tier_name AS current_tier,
             MAX(hist_t.rank_order) AS highest_rank_ever
      FROM dim_customer c
      JOIN customer_membership_history cur_h
        ON cur_h.customer_id = c.id AND cur_h.is_current = true
      JOIN dim_membership_tier cur_t
        ON cur_h.tier_id = cur_t.id AND cur_t.is_current = true
      JOIN customer_membership_history all_h
        ON all_h.customer_id = c.id
      JOIN dim_membership_tier hist_t
        ON all_h.tier_id = hist_t.id AND hist_t.is_current = true
      WHERE c.is_current = true
      GROUP BY c.id, c.customer_code, cur_t.tier_name
      ORDER BY c.customer_code;
    expected_row_count: ~
    expected_result_checksum: ~

