  - id: tune-024
    question: 统计全部门店 2026 年各月的目标完成率
    category: metric
    domain: sales
    required_tables: [fact_order, fact_order_item, store_target, dim_store]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH actual AS (
          SELECT o.store_id,
                 DATE_TRUNC('month', o.paid_at) AS month,
                 SUM(oi.net_amount) AS actual_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-07-01'
          GROUP BY o.store_id, DATE_TRUNC('month', o.paid_at)
      )
      SELECT st.store_name, a.month,
             a.actual_sales, t.target_value,
             ROUND(a.actual_sales / NULLIF(t.target_value, 0), 4) AS attainment_rate
      FROM actual a
      JOIN store_target t ON t.store_id = a.store_id
        AND t.target_month = a.month
        AND t.metric_code = 'NET_SALES'
      JOIN dim_store st ON a.store_id = st.id AND st.is_current = true
      ORDER BY st.store_name, a.month;
    expected_row_count: ~
    expected_result_checksum: ~

