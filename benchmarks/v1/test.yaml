    is_ordered: true

  - id: test-006
    question: 哪些商品在数据集中既有订单记录也有退款记录
    category: join
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item, dim_product, dim_sku]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT DISTINCT p.product_code, p.product_name
      FROM dim_product p
      JOIN dim_sku s ON s.product_id = p.id AND s.is_current = true
      WHERE EXISTS (
          SELECT 1 FROM fact_order_item oi
          JOIN fact_order o ON oi.order_id = o.id
          WHERE oi.sku_id = s.id
            AND o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
      )
      AND EXISTS (
          SELECT 1 FROM fact_refund_item ri
          JOIN fact_refund r ON ri.refund_id = r.id
          WHERE ri.sku_id = s.id
            AND r.refund_status = 'REFUNDED'
      )
      AND p.is_current = true
      ORDER BY p.product_code;
    expected_row_count: ~
    expected_result_checksum: ~

