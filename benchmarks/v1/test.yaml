  - id: test-011
    question: 查询数据集中库存周转最快的 SKU（按销售量/平均库存）
    category: aggregation
    domain: inventory
    required_tables: [fact_order_item, fact_order, fact_inventory_snapshot, dim_sku]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH sku_sales AS (
          SELECT oi.sku_id, SUM(oi.quantity) AS total_sold
          FROM fact_order_item oi
          JOIN fact_order o ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          GROUP BY oi.sku_id
      ),
      sku_avg_inv AS (
          SELECT sku_id, AVG(available_quantity) AS avg_inventory
          FROM fact_inventory_snapshot
          GROUP BY sku_id
      )
      SELECT sk.sku_code,
             ss.total_sold,
             ROUND(sai.avg_inventory, 2) AS avg_inventory,
             ROUND(ss.total_sold / NULLIF(sai.avg_inventory, 0), 4) AS turnover_rate
      FROM sku_sales ss
      JOIN sku_avg_inv sai ON sai.sku_id = ss.sku_id
      JOIN dim_sku sk ON sk.id = ss.sku_id AND sk.is_current = true
      ORDER BY turnover_rate DESC
      LIMIT 10;
    expected_row_count: ~
    expected_result_checksum: ~
    is_ordered: true

