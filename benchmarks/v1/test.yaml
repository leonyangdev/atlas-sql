  # 聚合（3 题）
  - id: test-009
    question: 2026 年第一季度各门店的销售额和退款额
    category: aggregation
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item, dim_store]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH q1_sales AS (
          SELECT o.store_id, SUM(oi.net_amount) AS net_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-04-01'
          GROUP BY o.store_id
      ),
      q1_refunds AS (
          SELECT o.store_id, SUM(ri.refund_amount) AS refunded
          FROM fact_order o
          JOIN fact_refund r ON r.order_id = o.id AND r.refund_status = 'REFUNDED'
          JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE r.refunded_at >= '2026-01-01'
            AND r.refunded_at < '2026-04-01'
            AND o.is_test = false
          GROUP BY o.store_id
      )
      SELECT st.store_name,
             COALESCE(s.net_sales, 0) AS net_sales,
             COALESCE(r.refunded, 0) AS refunded_amount
      FROM dim_store st
      LEFT JOIN q1_sales s ON s.store_id = st.id
      LEFT JOIN q1_refunds r ON r.store_id = st.id
      WHERE st.is_current = true
      ORDER BY st.store_name;
    expected_row_count: ~
    expected_result_checksum: ~

