  - id: test-024
    question: 最新快照日期的总可用库存与上一快照日期相比变化了多少
    category: metric
    domain: inventory
    required_tables: [fact_inventory_snapshot]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH latest_two AS (
          SELECT snapshot_date,
                 ROW_NUMBER() OVER (ORDER BY snapshot_date DESC) AS rn
          FROM fact_inventory_snapshot
          GROUP BY snapshot_date
      ),
      period_totals AS (
          SELECT s.snapshot_date, SUM(s.available_quantity) AS total_available
          FROM fact_inventory_snapshot s
          JOIN latest_two lt ON lt.snapshot_date = s.snapshot_date
          WHERE lt.rn <= 2
          GROUP BY s.snapshot_date
      )
      SELECT
        MAX(CASE WHEN rn = 1 THEN total_available END) AS latest_available,
        MAX(CASE WHEN rn = 2 THEN total_available END) AS prev_available,
        MAX(CASE WHEN rn = 1 THEN total_available END) -
        MAX(CASE WHEN rn = 2 THEN total_available END) AS delta
      FROM period_totals
      JOIN latest_two USING (snapshot_date);
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [inventory_available_quantity]

