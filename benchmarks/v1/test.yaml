  - id: test-013
    question: 2026 年客单价最高的 5 个城市
    category: top_n
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_store, dim_city]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT c.city_name,
             SUM(oi.net_amount) / NULLIF(COUNT(DISTINCT o.id), 0) AS aov
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_store st ON o.store_id = st.id AND st.is_current = true
      JOIN dim_city c ON st.city_id = c.id AND c.is_current = true
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false
        AND o.paid_at >= '2026-01-01'
        AND o.paid_at < '2026-07-01'
      GROUP BY c.id, c.city_name
      HAVING COUNT(DISTINCT o.id) > 0
      ORDER BY aov DESC
      LIMIT 5;
    expected_row_count: ~
    expected_result_checksum: ~
    is_ordered: true

  - id: test-014
    question: 营销活动 ROI 最高的前 3 个（ROI = 净销售额/营销费用）
    category: top_n
    domain: marketing
    required_tables: [dim_campaign, fact_campaign_touch, fact_marketing_spend, fact_order, fact_order_item]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH campaign_revenue AS (
          SELECT t.campaign_id, SUM(oi.net_amount) AS attributed_sales
          FROM fact_campaign_touch t
          JOIN fact_order o ON o.customer_id = t.customer_id
            AND o.ordered_at > t.touched_at
            AND o.ordered_at < t.touched_at + INTERVAL '30 days'
            AND o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
          JOIN fact_order_item oi ON oi.order_id = o.id
          GROUP BY t.campaign_id
      ),
      campaign_spend AS (
          SELECT campaign_id, SUM(spend_amount) AS total_spend
          FROM fact_marketing_spend
          GROUP BY campaign_id
      )
      SELECT c.campaign_name,
             COALESCE(cr.attributed_sales, 0) AS attributed_sales,
             COALESCE(cs.total_spend, 0) AS total_spend,
             ROUND(COALESCE(cr.attributed_sales, 0) / NULLIF(cs.total_spend, 0), 4) AS roi
      FROM dim_campaign c
      LEFT JOIN campaign_revenue cr ON cr.campaign_id = c.id
      LEFT JOIN campaign_spend cs ON cs.campaign_id = c.id
      WHERE c.is_current = true
      ORDER BY roi DESC NULLS LAST
      LIMIT 3;
    expected_row_count: ~
    expected_result_checksum: ~
    is_ordered: true

  # 时间（5 题）
  - id: test-015
    question: 2026 年每月有效订单量的环比增长率
    category: time_mom
    domain: sales
    required_tables: [fact_order]
    difficulty: medium
    identity: public
    gold_sql: |
      WITH monthly AS (
          SELECT DATE_TRUNC('month', paid_at) AS month,
                 COUNT(DISTINCT id) AS order_count
          FROM fact_order
          WHERE order_status IN ('PAID', 'COMPLETED')
            AND is_test = false
            AND paid_at >= '2026-01-01'
            AND paid_at < '2026-07-01'
          GROUP BY DATE_TRUNC('month', paid_at)
      )
      SELECT m.month, m.order_count,
             LAG(m.order_count) OVER (ORDER BY m.month) AS prev_month_count,
             ROUND(
               (m.order_count - LAG(m.order_count) OVER (ORDER BY m.month))::numeric
               / NULLIF(LAG(m.order_count) OVER (ORDER BY m.month), 0),
               4
             ) AS mom_growth
      FROM monthly m
      ORDER BY m.month;
    expected_row_count: ~
    expected_result_checksum: ~

