        SUM(CASE WHEN o.paid_at >= '2026-04-01' AND o.paid_at < '2026-07-01'
                 THEN oi.net_amount END)
        / NULLIF(COUNT(DISTINCT CASE WHEN o.paid_at >= '2026-04-01' AND o.paid_at < '2026-07-01'
                                     THEN o.id END), 0) AS aov_q2_2026
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false;
