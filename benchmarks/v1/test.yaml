  # 指标语义（3 题）
  - id: test-022
    question: 计算数据集整体的退款率
    category: metric
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item]
    difficulty: medium
    identity: public
    gold_sql: |
      WITH sales AS (
          SELECT SUM(oi.net_amount) AS gross_paid
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
      ),
      refunds AS (
          SELECT SUM(ri.refund_amount) AS total_refunded
          FROM fact_refund r
          JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE r.refund_status = 'REFUNDED'
      )
      SELECT
        (SELECT gross_paid FROM sales) AS gross_paid,
        COALESCE((SELECT total_refunded FROM refunds), 0) AS total_refunded,
        ROUND(COALESCE((SELECT total_refunded FROM refunds), 0)
              / NULLIF((SELECT gross_paid FROM sales), 0), 4) AS refund_rate;
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [refund_rate]

  - id: test-023
    question: 计算截止业务时钟各门店的历史总销售额（净销售额口径）
