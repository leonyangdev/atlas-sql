  - id: train-012
    question: 查询 Apple 品牌在本数据集中所有的销售记录数量
    category: join
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_sku, dim_product, dim_brand]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT COUNT(DISTINCT o.id) AS order_count,
             COUNT(oi.id) AS order_item_count
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_sku s ON oi.sku_id = s.id AND s.is_current = true
      JOIN dim_product p ON s.product_id = p.id AND p.is_current = true
      JOIN dim_brand b ON p.brand_id = b.id AND b.is_current = true
      WHERE b.brand_name = 'Apple'
        AND o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false;
    expected_row_count: 1
    expected_result_checksum: ~
    note: 值映射：Apple（英文品牌名）

  - id: train-013
    question: 列出所有退款订单的退款金额和原订单金额
    category: join
    domain: sales
    required_tables: [fact_order, fact_refund, fact_refund_item]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT o.order_no, o.order_amount, SUM(ri.refund_amount) AS refunded_amount
      FROM fact_order o
      JOIN fact_refund r ON r.order_id = o.id AND r.refund_status = 'REFUNDED'
      JOIN fact_refund_item ri ON ri.refund_id = r.id
      WHERE o.is_test = false
      GROUP BY o.id, o.order_no, o.order_amount
      ORDER BY o.order_no;
    expected_row_count: ~
    expected_result_checksum: ~
    note: 退款 Join，测试 Join 放大意识

  - id: train-014
    question: 查询每个营销活动的名称、渠道和已花费金额
    category: join
    domain: marketing
    required_tables: [dim_campaign, dim_marketing_channel, fact_marketing_spend]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT c.campaign_name, ch.channel_name,
             COALESCE(SUM(s.spend_amount), 0) AS total_spend
      FROM dim_campaign c
      LEFT JOIN dim_marketing_channel ch
        ON c.channel_id = ch.id AND ch.is_current = true
      LEFT JOIN fact_marketing_spend s ON s.campaign_id = c.id
      WHERE c.is_current = true
      GROUP BY c.id, c.campaign_name, ch.channel_name
      ORDER BY total_spend DESC;
    expected_row_count: ~
    expected_result_checksum: ~

  - id: train-015
    question: 查询每个仓库、每个 SKU 在最新快照日期的可用库存
    category: join
    domain: inventory
    required_tables: [fact_inventory_snapshot, dim_warehouse, dim_sku]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT w.warehouse_name, sk.sku_code, s.available_quantity, s.snapshot_date
      FROM fact_inventory_snapshot s
      JOIN dim_warehouse w ON s.warehouse_id = w.id AND w.is_current = true
      JOIN dim_sku sk ON s.sku_id = sk.id AND sk.is_current = true
      WHERE s.snapshot_date = (
          SELECT MAX(s2.snapshot_date)
