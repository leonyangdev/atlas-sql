            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-07-01'
          GROUP BY o.store_id, DATE_TRUNC('month', o.paid_at)
      )
      SELECT st.store_name, a.month,
             a.actual_amount, t.target_value,
             ROUND(a.actual_amount / NULLIF(t.target_value, 0), 4) AS attainment_rate
      FROM actual_sales a
      JOIN store_target t
        ON t.store_id = a.store_id
        AND t.target_month = a.month
        AND t.metric_code = 'NET_SALES'
      JOIN dim_store st ON a.store_id = st.id AND st.is_current = true
      WHERE a.actual_amount > t.target_value * 1.1
      ORDER BY attainment_rate DESC;
    expected_row_count: ~
    expected_result_checksum: ~

