  - id: train-030
    question: 消费最高的 10 位客户
    category: top_n
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_customer]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT c.customer_code, SUM(oi.net_amount) AS total_spent
      FROM fact_order o
