  - id: train-021
    question: 每个品类的平均客单价是多少
    category: aggregation
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_sku, dim_product, product_category_history, dim_category]
    difficulty: hard
    identity: public
    gold_sql: |
      SELECT cat.category_name,
             SUM(oi.net_amount) / NULLIF(COUNT(DISTINCT o.id), 0) AS aov
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_sku s ON oi.sku_id = s.id AND s.is_current = true
      JOIN dim_product p ON s.product_id = p.id AND p.is_current = true
      JOIN product_category_history pch
        ON pch.product_id = p.id AND pch.is_primary = true
        AND (pch.valid_to_date IS NULL OR pch.valid_to_date > '2026-06-30')
      JOIN dim_category cat ON pch.category_id = cat.id AND cat.is_current = true
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false
      GROUP BY cat.id, cat.category_name
      ORDER BY aov DESC;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [average_order_value]

