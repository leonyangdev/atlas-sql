  - id: train-038
    question: 2026 年第一季度北区销售额同比 2025 年第一季度的增长率
    category: time_yoy
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_store, dim_city, dim_region]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH regional_sales AS (
          SELECT
            EXTRACT(YEAR FROM o.paid_at) AS yr,
            SUM(oi.net_amount) AS net_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          JOIN dim_store st ON o.store_id = st.id AND st.is_current = true
          JOIN dim_city c ON st.city_id = c.id AND c.is_current = true
          JOIN dim_region r ON c.region_id = r.id AND r.is_current = true
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND r.region_code = 'NORTH'
            AND ((o.paid_at >= '2025-01-01' AND o.paid_at < '2025-04-01')
              OR (o.paid_at >= '2026-01-01' AND o.paid_at < '2026-04-01'))
          GROUP BY EXTRACT(YEAR FROM o.paid_at)
      )
      SELECT
        MAX(CASE WHEN yr = 2025 THEN net_sales END) AS q1_2025,
        MAX(CASE WHEN yr = 2026 THEN net_sales END) AS q1_2026,
        ROUND(
          (MAX(CASE WHEN yr = 2026 THEN net_sales END) -
           MAX(CASE WHEN yr = 2025 THEN net_sales END)) /
          NULLIF(MAX(CASE WHEN yr = 2025 THEN net_sales END), 0),
          4
        ) AS yoy_growth
      FROM regional_sales;
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [net_sales]

