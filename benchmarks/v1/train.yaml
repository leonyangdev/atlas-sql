  - id: train-050
    question: 2026 年各月的退款率趋势
    category: metric
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH monthly_sales AS (
          SELECT DATE_TRUNC('month', o.paid_at) AS month,
                 SUM(oi.net_amount) AS gross_paid_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-07-01'
          GROUP BY DATE_TRUNC('month', o.paid_at)
      ),
      monthly_refunds AS (
          SELECT DATE_TRUNC('month', r.refunded_at) AS month,
                 SUM(ri.refund_amount) AS refunded_amount
          FROM fact_refund r
          JOIN fact_refund_item ri ON ri.refund_id = r.id
          WHERE r.refund_status = 'REFUNDED'
            AND r.refunded_at >= '2026-01-01'
            AND r.refunded_at < '2026-07-01'
          GROUP BY DATE_TRUNC('month', r.refunded_at)
      )
      SELECT
        s.month,
        s.gross_paid_sales,
        COALESCE(rf.refunded_amount, 0) AS refunded_amount,
        ROUND(COALESCE(rf.refunded_amount, 0) / NULLIF(s.gross_paid_sales, 0), 4) AS refund_rate
      FROM monthly_sales s
      LEFT JOIN monthly_refunds rf ON rf.month = s.month
      ORDER BY s.month;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [refund_rate]

