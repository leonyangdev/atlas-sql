      SELECT COUNT(DISTINCT c.id) AS vip_customer_count
      FROM dim_customer c
      JOIN bridge_customer_tag bt ON bt.customer_id = c.id
        AND (bt.expired_at IS NULL OR bt.expired_at > '2026-06-30')
      JOIN dim_customer_tag t ON bt.tag_id = t.id
        AND t.is_current = true
        AND t.tag_code = 'VIP'
      WHERE c.is_current = true
        AND c.status = 'ACTIVE';
    expected_row_count: 1
    expected_result_checksum: ~
    note: 多对多桥表，测试有效期过滤

  - id: train-018
    question: 查询每个品类下的在售商品数量
