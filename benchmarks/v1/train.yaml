  - id: train-047
    question: 计算 2026 年上半年北区的毛利率
    category: metric
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_store, dim_city, dim_region,
                      fact_refund, fact_refund_item, fact_cost_ledger]
    difficulty: hard
    identity: restricted
    gold_sql: |
      -- 毛利率 = (net_sales - recognized_cost) / net_sales
      -- 成本来自 fact_cost_ledger，敏感字段需要 restricted 权限
      WITH period_sales AS (
          SELECT oi.id AS item_id, oi.net_amount,
                 o.store_id, o.order_status, o.is_test, o.paid_at
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.paid_at >= '2026-01-01'
            AND o.paid_at < '2026-07-01'
      ),
      north_sales AS (
          SELECT ps.net_amount
          FROM period_sales ps
          JOIN dim_store st ON st.id = ps.store_id AND st.is_current = true
          JOIN dim_city c ON st.city_id = c.id AND c.is_current = true
          JOIN dim_region r ON c.region_id = r.id
            AND r.is_current = true AND r.region_code = 'NORTH'
      ),
      north_cost AS (
          SELECT SUM(cl.amount) AS total_cost
          FROM fact_cost_ledger cl
          JOIN dim_cost_center cc ON cl.cost_center_id = cc.id AND cc.is_current = true
          JOIN dim_region r ON cc.region_id = r.id
            AND r.is_current = true AND r.region_code = 'NORTH'
          WHERE cl.ledger_date >= '2026-01-01'
            AND cl.ledger_date < '2026-07-01'
      )
      SELECT
        SUM(ns.net_amount) AS net_sales,
        (SELECT total_cost FROM north_cost) AS recognized_cost,
        ROUND(
          1.0 - (SELECT total_cost FROM north_cost) / NULLIF(SUM(ns.net_amount), 0),
          4
        ) AS gross_margin_rate
      FROM north_sales ns;
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [gross_margin_rate, net_sales, gross_profit]
    note: 毛利率查询需要 restricted 权限；不展示成本明细

