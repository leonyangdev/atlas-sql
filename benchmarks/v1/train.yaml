  - id: train-001
    question: 查询所有门店的名称和类型
    category: single_table
    domain: store
    required_tables: [dim_store]
    required_columns: [store_name, store_type]
    difficulty: easy
    identity: public
    gold_sql: |
      SELECT store_name, store_type
      FROM dim_store
      WHERE is_current = true
      ORDER BY store_name;
    expected_row_count: 4
    expected_result_checksum: ~
    note: 维度表基础查询，验证 is_current 过滤

