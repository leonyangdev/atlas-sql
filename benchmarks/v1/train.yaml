  - id: train-057
    question: 北区经理查询北区所有门店本月销售额
    category: permission_row
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_store, dim_city, dim_region]
    difficulty: medium
    identity: analyst_north
    gold_sql: |
      SELECT st.store_name, SUM(oi.net_amount) AS net_sales
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_store st ON o.store_id = st.id AND st.is_current = true
      JOIN dim_city c ON st.city_id = c.id AND c.is_current = true
      JOIN dim_region r ON c.region_id = r.id AND r.is_current = true
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false
        AND r.region_code = 'NORTH'  -- 行权限过滤
        AND o.paid_at >= '2026-06-01'
        AND o.paid_at < '2026-07-01'
      GROUP BY st.id, st.store_name
      ORDER BY net_sales DESC;
    expected_row_count: ~
    expected_result_checksum: ~
    note: analyst_north 只能看到 NORTH 区域数据，不能看 SOUTH

  - id: train-058
