  - id: train-043
    question: 苹果手机的销售额是多少
    category: value_mapping
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_sku, dim_product, dim_brand, dim_category]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT SUM(oi.net_amount) AS net_sales
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_sku s ON oi.sku_id = s.id AND s.is_current = true
      JOIN dim_product p ON s.product_id = p.id AND p.is_current = true
      JOIN dim_brand b ON p.brand_id = b.id AND b.is_current = true
      JOIN product_category_history pch
        ON pch.product_id = p.id AND pch.is_primary = true
        AND (pch.valid_to_date IS NULL OR pch.valid_to_date > '2026-06-30')
      JOIN dim_category cat ON pch.category_id = cat.id AND cat.is_current = true
      WHERE b.brand_name = 'Apple'
        AND (cat.category_name ILIKE '%手机%' OR cat.category_name ILIKE '%phone%'
             OR cat.category_name ILIKE '%smartphone%')
        AND o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false;
    expected_row_count: 1
    expected_result_checksum: ~
    note: '"苹果"→ brand_name=Apple；"手机"→ 品类名称含 phone/smartphone'

  - id: train-044
    question: VIP 客户的客单价与普通客户相比差多少
    category: value_mapping
    domain: customer
    required_tables: [fact_order, fact_order_item, dim_customer, bridge_customer_tag, dim_customer_tag]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH customer_aov AS (
          SELECT
            o.customer_id,
            SUM(oi.net_amount) / NULLIF(COUNT(DISTINCT o.id), 0) AS aov
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.customer_id IS NOT NULL
          GROUP BY o.customer_id
      ),
      vip_flag AS (
          SELECT DISTINCT bt.customer_id, true AS is_vip
          FROM bridge_customer_tag bt
          JOIN dim_customer_tag t ON bt.tag_id = t.id
            AND t.is_current = true
            AND t.tag_code = 'VIP'
          WHERE (bt.expired_at IS NULL OR bt.expired_at > '2026-06-30')
      )
      SELECT
        AVG(CASE WHEN v.is_vip THEN a.aov END) AS vip_aov,
        AVG(CASE WHEN v.is_vip IS NULL THEN a.aov END) AS non_vip_aov
      FROM customer_aov a
      LEFT JOIN vip_flag v ON v.customer_id = a.customer_id;
    expected_row_count: 1
    expected_result_checksum: ~

