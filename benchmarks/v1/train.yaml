    expected_result_checksum: ~
    note: 快照表不能跨日直接求和，必须取最新快照

  - id: train-016
    question: 查询每个城市的线上销售额（仅线上渠道）
    category: join
    domain: sales
    required_tables: [fact_order, fact_order_item, dim_store, dim_city, dim_sales_channel]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT c.city_name, SUM(oi.net_amount) AS online_sales
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_sales_channel ch ON o.channel_id = ch.id AND ch.is_current = true
      JOIN dim_store st ON o.store_id = st.id AND st.is_current = true
      JOIN dim_city c ON st.city_id = c.id AND c.is_current = true
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false
        AND ch.is_online = true
      GROUP BY c.id, c.city_name
      ORDER BY online_sales DESC;
    expected_row_count: ~
    expected_result_checksum: ~

  - id: train-017
    question: 查询持有 VIP 标签的客户总数
    category: join
    domain: customer
    required_tables: [dim_customer, bridge_customer_tag, dim_customer_tag]
    difficulty: medium
