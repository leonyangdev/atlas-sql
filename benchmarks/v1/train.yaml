    gold_sql: |
      WITH actual_sales AS (
          SELECT o.store_id,
                 DATE_TRUNC('month', o.paid_at) AS month,
                 SUM(oi.net_amount) AS actual_amount
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
