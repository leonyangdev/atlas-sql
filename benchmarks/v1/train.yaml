  - id: train-024
    question: 每个月的新客户数量（按首次有效支付时间）
    category: aggregation
    domain: customer
    required_tables: [fact_order, dim_customer]
    difficulty: medium
    identity: public
    gold_sql: |
      WITH first_purchase AS (
          SELECT o.customer_id,
                 MIN(o.paid_at) AS first_paid_at
          FROM fact_order o
          WHERE o.order_status IN ('PAID', 'COMPLETED')
            AND o.is_test = false
            AND o.customer_id IS NOT NULL
          GROUP BY o.customer_id
      )
      SELECT DATE_TRUNC('month', first_paid_at) AS month,
             COUNT(*) AS new_customers
      FROM first_purchase
      GROUP BY DATE_TRUNC('month', first_paid_at)
      ORDER BY month;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [new_customer_count]

  - id: train-025
    question: 每个 SKU 的退款率是多少（按退款金额除以销售金额）
    category: aggregation
    domain: sales
    required_tables: [fact_order, fact_order_item, fact_refund, fact_refund_item, dim_sku]
    difficulty: hard
    identity: public
    gold_sql: |
      WITH sales AS (
          SELECT oi.sku_id, SUM(oi.net_amount) AS total_sales
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          WHERE o.order_status IN ('PAID', 'COMPLETED') AND o.is_test = false
          GROUP BY oi.sku_id
      ),
      refunds AS (
          SELECT oi.sku_id, SUM(ri.refund_amount) AS total_refunded
          FROM fact_order o
          JOIN fact_order_item oi ON oi.order_id = o.id
          JOIN fact_refund r ON r.order_id = o.id AND r.refund_status = 'REFUNDED'
          JOIN fact_refund_item ri ON ri.refund_id = r.id AND ri.order_item_id = oi.id
          WHERE o.is_test = false
          GROUP BY oi.sku_id
      )
      SELECT sk.sku_code,
             ROUND(COALESCE(rf.total_refunded, 0) / NULLIF(s.total_sales, 0), 4) AS refund_rate
      FROM sales s
      LEFT JOIN refunds rf ON rf.sku_id = s.sku_id
      JOIN dim_sku sk ON sk.id = s.sku_id AND sk.is_current = true
      ORDER BY refund_rate DESC NULLS LAST;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [refund_rate]
    note: 退款 Join 容易产生放大，必须按 order_item_id 关联

  - id: train-026
    question: 各城市的平均库存可用量（基于最新快照）
    category: aggregation
    domain: inventory
    required_tables: [fact_inventory_snapshot, dim_warehouse, dim_city]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT c.city_name,
             SUM(s.available_quantity) AS total_available,
             AVG(s.available_quantity) AS avg_available_per_sku_warehouse
      FROM fact_inventory_snapshot s
      JOIN dim_warehouse w ON s.warehouse_id = w.id AND w.is_current = true
      JOIN dim_city c ON w.city_id = c.id AND c.is_current = true
      WHERE s.snapshot_date = (SELECT MAX(s2.snapshot_date) FROM fact_inventory_snapshot s2)
      GROUP BY c.id, c.city_name
      ORDER BY total_available DESC;
    expected_row_count: ~
    expected_result_checksum: ~
    metric_ids: [inventory_available_quantity]

