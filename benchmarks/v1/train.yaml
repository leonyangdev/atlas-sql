      SELECT p.product_name, s.sku_code, oi.quantity, oi.net_amount
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      JOIN dim_sku s ON oi.sku_id = s.id AND s.is_current = true
