  - id: train-035
    question: 2025 年和 2026 年上半年的销售额对比（同比）
    category: time_yoy
    domain: sales
    required_tables: [fact_order, fact_order_item]
    difficulty: medium
    identity: public
    gold_sql: |
      SELECT
        SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2025-07-01'
                 THEN oi.net_amount ELSE 0 END) AS net_sales_h1_2025,
        SUM(CASE WHEN o.paid_at >= '2026-01-01' AND o.paid_at < '2026-07-01'
                 THEN oi.net_amount ELSE 0 END) AS net_sales_h1_2026,
        ROUND(
          (SUM(CASE WHEN o.paid_at >= '2026-01-01' AND o.paid_at < '2026-07-01'
                    THEN oi.net_amount ELSE 0 END) -
           SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2025-07-01'
                    THEN oi.net_amount ELSE 0 END)) /
          NULLIF(SUM(CASE WHEN o.paid_at >= '2025-01-01' AND o.paid_at < '2025-07-01'
                          THEN oi.net_amount ELSE 0 END), 0),
          4
        ) AS yoy_growth_rate
      FROM fact_order o
      JOIN fact_order_item oi ON oi.order_id = o.id
      WHERE o.order_status IN ('PAID', 'COMPLETED')
        AND o.is_test = false
        AND o.paid_at >= '2025-01-01'
        AND o.paid_at < '2026-07-01';
    expected_row_count: 1
    expected_result_checksum: ~
    metric_ids: [net_sales]

