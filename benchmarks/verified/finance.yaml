# Finance 域可信查询样例（含敏感指标，需权限）
domain: finance
schema_version: "001"
semantic_version_ref: "gross_margin_rate:v1,gross_profit:v1"

queries:
  - question: "2026 年上半年各品类的毛利率是多少？"
    sql: |
      SELECT
        dpc.category_name,
        SUM(foi.net_amount - foi.cost_amount) AS gross_profit,
        SUM(foi.net_amount) - COALESCE(SUM(fri.refund_amount), 0) AS net_sales,
        SUM(foi.net_amount - foi.cost_amount) /
          NULLIF(SUM(foi.net_amount) - COALESCE(SUM(fri.refund_amount), 0), 0) AS gross_margin_rate
      FROM fact_order_item foi
      JOIN fact_order fo ON fo.id = foi.order_id
      JOIN dim_product dp ON dp.id = foi.product_id AND dp.is_current = true
      JOIN dim_product_category dpc ON dpc.id = dp.category_id
      LEFT JOIN fact_refund_item fri ON fri.order_item_id = foi.id
      LEFT JOIN fact_refund fr ON fr.id = fri.refund_id AND fr.refund_status = 'REFUNDED'
      WHERE fo.order_status IN ('PAID', 'COMPLETED')
        AND fo.is_test = false
        AND fo.paid_at >= TIMESTAMPTZ '2026-01-01 00:00:00+08:00'
        AND fo.paid_at < TIMESTAMPTZ '2026-07-01 00:00:00+08:00'
      GROUP BY dpc.category_name
      ORDER BY gross_margin_rate DESC
    tags: [gross_margin_rate, 毛利率, 品类, 敏感]
    dependent_metric_ids: [gross_margin_rate, gross_profit, net_sales]
    is_test_locked: false

  - question: "2026 年各区域的毛利额是多少？"
    sql: |
      SELECT
        dr.region_name,
        SUM(foi.net_amount - foi.cost_amount) AS gross_profit
      FROM fact_order_item foi
      JOIN fact_order fo ON fo.id = foi.order_id
      JOIN dim_store ds ON ds.id = fo.store_id AND ds.is_current = true
      JOIN dim_city dc ON dc.id = ds.city_id
      JOIN dim_region dr ON dr.id = dc.region_id
      LEFT JOIN fact_refund_item fri ON fri.order_item_id = foi.id
      WHERE fo.order_status IN ('PAID', 'COMPLETED')
        AND fo.is_test = false
        AND fo.paid_at >= TIMESTAMPTZ '2026-01-01 00:00:00+08:00'
        AND fo.paid_at < TIMESTAMPTZ '2027-01-01 00:00:00+08:00'
      GROUP BY dr.region_name
      ORDER BY gross_profit DESC
    tags: [gross_profit, 毛利额, 区域, 敏感]
    dependent_metric_ids: [gross_profit]
    is_test_locked: false

  - question: "毛利率低于 20% 的品类有哪些？"
    sql: |
      SELECT
        dpc.category_name,
        SUM(foi.net_amount - foi.cost_amount) /
          NULLIF(SUM(foi.net_amount) - COALESCE(SUM(fri.refund_amount), 0), 0) AS gross_margin_rate
      FROM fact_order_item foi
      JOIN fact_order fo ON fo.id = foi.order_id
      JOIN dim_product dp ON dp.id = foi.product_id AND dp.is_current = true
      JOIN dim_product_category dpc ON dpc.id = dp.category_id
      LEFT JOIN fact_refund_item fri ON fri.order_item_id = foi.id
      LEFT JOIN fact_refund fr ON fr.id = fri.refund_id AND fr.refund_status = 'REFUNDED'
      WHERE fo.order_status IN ('PAID', 'COMPLETED') AND fo.is_test = false
      GROUP BY dpc.category_name
      HAVING SUM(foi.net_amount - foi.cost_amount) /
        NULLIF(SUM(foi.net_amount) - COALESCE(SUM(fri.refund_amount), 0), 0) < 0.20
      ORDER BY gross_margin_rate
    tags: [gross_margin_rate, 毛利率, 条件过滤, HAVING]
    dependent_metric_ids: [gross_margin_rate]
    is_test_locked: false
