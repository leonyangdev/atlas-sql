[project]
name = "atlas-sql"
version = "0.1.0"
description = "Enterprise NL2SQL and data intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "redis>=6,<8",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlglot>=27,<29",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "datasets"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  # Celery 后台任务：依赖 Redis + Worker 进程，需集成测试，V2 补齐
  "server/tasks/*",
  # Gold SQL 执行器：需业务库 + Gold 题库联动，V2 基线脚本覆盖
  "server/evaluation/gold_executor.py",
  # CLI 脚本：入口胶水代码，不含业务逻辑
  "scripts/*",
  "datasets/migrations.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [" docs", "altassql-book", "plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["server", "datasets"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
